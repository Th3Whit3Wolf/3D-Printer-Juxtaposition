name: Add or update a 3D printer
description: Suggest a printer for the comparison site. A pull request is created from this form automatically.
title: "Printer: "
labels:
- new-printer
body:
- type: markdown
  attributes:
    value: |
      Fill in what you know. When you submit, a bot turns this issue into a pull request.
      If something needs fixing, the bot comments here — edit the issue and it tries again.
      Submitting a printer that's already listed (same brand and model) updates it instead.

- type: input
  id: brand
  attributes:
    label: Brand
    placeholder: Bambu Lab
  validations:
    required: true

- type: input
  id: model
  attributes:
    label: Model
    placeholder: P1S
  validations:
    required: true

- type: input
  id: price
  attributes:
    label: Price (USD)
    description: Current price in US dollars. Numbers only.
    placeholder: "699"
  validations:
    required: true

- type: input
  id: build-x
  attributes:
    label: Build volume X (mm)
    placeholder: "256"
  validations:
    required: true

- type: input
  id: build-y
  attributes:
    label: Build volume Y (mm)
    placeholder: "256"
  validations:
    required: true

- type: input
  id: build-z
  attributes:
    label: Build volume Z (mm)
    placeholder: "256"
  validations:
    required: true

- type: dropdown
  id: technology
  attributes:
    label: Technology
    options:
    - FDM
    - Resin (MSLA)
    - SLS
    - Other
  validations:
    required: true

- type: checkboxes
  id: features
  attributes:
    label: Features
    options:
    - label: Enclosed build chamber
    - label: Multi-material or multi-color printing

- type: textarea
  id: image
  attributes:
    label: Product image
    description: Paste a direct link to an image, or drag an image file into this box. It gets copied into the repository.

- type: textarea
  id: links
  attributes:
    label: Where to buy
    description: |
      One link per line. Put a label before a `|` if you like; otherwise one is made from the web address.
    placeholder: |
      Official store | https://example.com/printer
      Amazon | https://www.amazon.com/dp/XXXXXXXXXX
  validations:
    required: true

- type: markdown
  attributes:
    value: "### Optional details"

- type: dropdown
  id: kinematics
  attributes:
    label: Motion system
    options:
    - CoreXY
    - Bed slinger
    - Delta
    - IDEX
    - Other

- type: input
  id: materials
  attributes:
    label: Colors or materials in one print
    description: With the maker's own multi-material unit, if one exists. 1 for single material.
    placeholder: "4"

- type: input
  id: hotend
  attributes:
    label: Hotend max temperature (°C)
    placeholder: "300"

- type: input
  id: bed
  attributes:
    label: Bed max temperature (°C)
    placeholder: "100"

- type: input
  id: speed
  attributes:
    label: Claimed top speed (mm/s)
    placeholder: "500"

- type: input
  id: footprint
  attributes:
    label: Machine size W × D × H (mm)
    description: Outer dimensions of the printer itself.
    placeholder: 389 × 389 × 458

- type: input
  id: weight
  attributes:
    label: Weight (kg)
    placeholder: "12.95"

- type: input
  id: released
  attributes:
    label: Release year
    placeholder: "2024"
